name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # pytest is a test-only tool: requirements.txt stays empty on
      # purpose (the runtime is standard-library only), so install
      # the runner explicitly here.
      - run: pip install pytest
      - run: python -m pytest
